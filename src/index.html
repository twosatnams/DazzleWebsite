<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dazzle | Elevating the Ballroom Competition Experience</title>
    <link rel="icon" href="logo.png" type="image/png" />
    
    <!-- Google Fonts: Playfair Display for elegance, Inter for readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dazzle: {
                            gold: '#D4AF37',
                            mutedGold: '#C5A028',
                            dark: '#050505',
                            charcoal: '#1a1a1a',
                            light: '#f4f4f5'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1s ease-out forwards',
                        'fade-in': 'fadeIn 1.5s ease-out forwards',
                        'spotlight-1': 'spotlight1 15s infinite alternate ease-in-out',
                        'spotlight-2': 'spotlight2 20s infinite alternate ease-in-out',
                        'float': 'float 10s infinite ease-in-out',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        spotlight1: {
                            '0%': { transform: 'translate(-20%, -20%) scale(1)', opacity: '0.4' },
                            '100%': { transform: 'translate(20%, 20%) scale(1.2)', opacity: '0.6' },
                        },
                        spotlight2: {
                            '0%': { transform: 'translate(20%, 0%) scale(1)', opacity: '0.3' },
                            '100%': { transform: 'translate(-20%, 10%) scale(1.1)', opacity: '0.5' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html {
            background-color: #050505;
            color: #f4f4f5;
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        body {
            max-width: 100vw;
            background-color: #050505;
            color: #f4f4f5;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
            height: 100%;
            position: relative;
        }
        
        ::selection {
            background: #D4AF37;
            color: #000;
        }

        /* Ambient Background Image */
        .bg-ballroom {
            /* Using a high-quality Unsplash image of a dark stage/dance floor */
            background-image: url('https://images.unsplash.com/photo-1547483238-2cbf881a559f?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            opacity: 0.15; /* Kept subtle */
            mix-blend-mode: luminosity;
        }

        /* Spotlight Effects */
        .spotlight-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .orb-gold {
            background: radial-gradient(circle, rgba(212,175,55,0.3) 0%, rgba(0,0,0,0) 70%);
            width: min(60vw, 500px);
            height: min(60vw, 500px);
            top: 5%;
            left: -5%;
        }

        .orb-blue {
            background: radial-gradient(circle, rgba(60, 70, 100, 0.4) 0%, rgba(0,0,0,0) 70%);
            width: min(70vw, 600px);
            height: min(70vw, 600px);
            bottom: 5%;
            right: -10%;
        }

        /* Dust Particles */
        .particle-container {
            position: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 2;
            pointer-events: none;
            top: 0;
            left: 0;
        }
        
        .particle {
            position: absolute;
            background: #D4AF37;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 10s infinite linear;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">

    <!-- LAYER 1: Background Image (Atmosphere) -->
    <div class="fixed inset-0 bg-ballroom z-0"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-dazzle-dark/90 via-dazzle-dark/70 to-dazzle-dark z-0"></div>

    <!-- LAYER 2: Animated Spotlights -->
    <div class="spotlight-orb orb-gold animate-spotlight-1"></div>
    <div class="spotlight-orb orb-blue animate-spotlight-2"></div>

    <!-- LAYER 3: Dust Particles (Simulating stage lights) -->
    <div class="particle-container">
        <!-- Manually placing a few "dust motes" -->
        <div class="particle w-1 h-1 top-[20%] left-[20%]" style="animation-duration: 8s;"></div>
        <div class="particle w-1.5 h-1.5 top-[60%] left-[80%]" style="animation-duration: 12s; opacity: 0.2"></div>
        <div class="particle w-1 h-1 top-[40%] left-[50%]" style="animation-duration: 15s;"></div>
        <div class="particle w-0.5 h-0.5 top-[80%] left-[10%]" style="animation-duration: 10s;"></div>
    </div>

    <!-- Spacer for top padding -->
    <div class="relative z-20 w-full py-8"></div>

    <!-- Main Content -->
    <main class="relative z-10 flex-grow flex flex-col justify-center items-center text-center px-4">
        
        <!-- Content Wrapper (Removed glass-panel styling) -->
        <div class="max-w-4xl mx-auto opacity-0 animate-fade-in-up" style="animation-delay: 0.5s;">

            <!-- Centered Logo -->
            <div class="flex justify-center mb-8">
                <div class="relative h-16 w-16 md:h-20 md:w-20 flex items-center justify-center">
                    <!-- Glowing effect behind logo -->
                    <div class="absolute inset-0 bg-dazzle-gold/20 blur-xl rounded-full"></div>
                    <!-- Logo Image -->
                    <img src="logo.png" alt="Dazzle Logo" class="relative h-14 w-14 md:h-18 md:w-18"/>
                </div>
            </div>

            <!-- Status Pill -->
            <div class="inline-flex items-center justify-center gap-2 px-3 py-1 rounded-full border border-dazzle-gold/20 bg-dazzle-gold/5 mb-8 backdrop-blur-sm">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-dazzle-gold opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-dazzle-gold"></span>
                </span>
                <span class="text-[10px] uppercase tracking-widest text-dazzle-gold/80">Platform Launching 2026</span>
            </div>

            <!-- Hero Title -->
            <h1 class="font-serif text-6xl md:text-8xl lg:text-9xl mb-6 tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-white via-white to-white/70 drop-shadow-lg">
                Dazzle
            </h1>

            <!-- Subtitle -->
            <p class="font-sans font-light text-zinc-300 text-lg md:text-xl max-w-xl mx-auto leading-relaxed mb-10">
                The new standard in ballroom competition management. <br/>
                <span class="italic font-serif text-dazzle-gold/80">Events, refined. Experience, elevated.</span>
            </p>

            <!-- Coming Soon -->
            <div class="flex flex-col items-center justify-center">
                <div class="relative px-8 py-3 group cursor-default select-none">
                    <span class="block font-serif italic text-3xl text-dazzle-gold opacity-90 tracking-wide transition-transform duration-700 ease-out group-hover:-translate-y-2">
                        Coming Soon
                    </span>
                    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-12 h-[1px] bg-dazzle-gold/50 transition-all duration-700 ease-out group-hover:w-3/4 group-hover:bg-dazzle-gold group-hover:opacity-100"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 w-full py-8 text-center border-t border-white/5">
        <div class="opacity-0 animate-fade-in" style="animation-delay: 1.5s;">
            <p class="text-[10px] text-zinc-700 uppercase tracking-widest">
                &copy; 2025 Dazzle Platform. All Rights Reserved.
            </p>
        </div>
    </footer>

    <!-- Init Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

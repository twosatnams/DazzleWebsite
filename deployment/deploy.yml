trigger:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  resourceGroupName: 'dazzle'
  staticWebAppName: 'website'
  azureSubscription: 'Azure Subscription Connection'

steps:
- task: AzureCLI@2
  name: 'DeployBicep'
  displayName: 'Deploy Azure Resources'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az deployment group create \
        --resource-group "$(resourceGroupName)" \
        --template-file "deployment/website.bicep" \
        --parameters staticWebAppName=$(staticWebAppName)

- task: AzureStaticWebApp@0
  displayName: 'Deploy Site Content'
  inputs:
    app_location: 'src'          # wherever index.html lives
    output_location: ''          # empty since we're not building anything
    skip_app_build: true         # no build step needed for static HTML
    azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APP_TOKEN)'
    